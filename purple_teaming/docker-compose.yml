services:
#  health:
#    image: ubuntu
#    command: "tail -f /dev/null"
#    cap_add:
#      - NET_ADMIN


  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - SERVERURL=auto
      - SERVERPORT=51820
      - PEERS=team1,team2,team3
      - PEERDNS=auto
      # - INTERNAL_SUBNET=10.53.0.0/24
      - ALLOWEDIPS=0.0.0.0/0
      - PERSISTENTKEEPALIVE_PEERS=
      - LOG_CONFS=true
    volumes:
      - ./wireguard:/config
      - /lib/modules:/lib/modules
    ports:
      - 51820:51820/udp
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    restart: unless-stopped
    networks:
      - wireguard_net
        # ipv4_address: 10.53.0.10

  app:
    build: ./DnA-Framework-AppTest/
    networks:
      - wireguard_net
        # ipv4_address: 10.53.0.50

networks:
  wireguard_net:
    driver: bridge
